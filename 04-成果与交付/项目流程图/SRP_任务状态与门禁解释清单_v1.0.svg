  <title id="title">SRP v2.1 任务状态与门禁解释清单</title>
  <desc id="desc">解释 SRP 任务注册表的七种任务状态、三种门禁、五类任务颜色和依赖线含义。快照日期为 2026-09-03。</desc>
  <metadata>snapshot=2026-09-03; tasks=57; done=11; in_progress=1; in_review=2; ready=1; wait_dep=25; wait_dep_external=4; blocked_external=13; status_basis=05_可领取任务包.csv@working-tree; v04_signoff=68db963</metadata>

  <style>
    text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #1d2732; }
    .title { font-size: 42px; font-weight: 700; }
    .subtitle { font-size: 19px; fill: #66717a; }
    .summary { font-size: 21px; font-weight: 700; }
    .section-title { font-size: 28px; font-weight: 700; }
    .column-title { font-size: 18px; font-weight: 700; fill: #ffffff; }
    .status-name { font-size: 21px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .registry-name { font-size: 21px; font-weight: 700; }
    .count { font-size: 30px; font-weight: 700; text-anchor: middle; }
